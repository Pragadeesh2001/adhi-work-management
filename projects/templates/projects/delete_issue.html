<!DOCTYPE html>
<html>
<head>
    <title>Delete Issue</title>
</head>

<body>

    <h1>Delete Issue</h1>

    <h2>{{ project.project_number }} - {{ project.name }}</h2>

    <p>Are you sure you want to delete this issue?</p>

    <p>
        <strong>Title:</strong>
        {{ issue.title }}
    </p>

    <p>
        <strong>Status:</strong>
        {{ issue.status }}
    </p>

    <p>
        <strong>Date:</strong>
        {{ issue.date }}
    </p>

    <p>
        <strong>Description:</strong>
        {{ issue.description }}
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'project_detail' project.id %}">
            Cancel
        </a>

    </form>

</body>
</html>
