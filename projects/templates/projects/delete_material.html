<!DOCTYPE html>
<html>
<head>
    <title>Delete Material</title>
</head>

<body>

    <h1>Delete Material</h1>

    <h2>{{ project.project_number }} - {{ project.name }}</h2>

    <p>Are you sure you want to delete this material?</p>

    <p>
        <strong>Name:</strong>
        {{ material.name }}
    </p>

    <p>
        <strong>Quantity:</strong>
        {{ material.quantity }} {{ material.unit }}
    </p>

    <p>
        <strong>Date:</strong>
        {{ material.date }}
    </p>

    <p>
        <strong>Remarks:</strong>
        {{ material.remarks }}
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'project_detail' project.id %}">
            Cancel
        </a>

    </form>

</body>
</html>
