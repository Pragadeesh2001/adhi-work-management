<!DOCTYPE html>
<html>
<head>
    <title>Delete Progress</title>
</head>

<body>

    <h1>Delete Progress</h1>

    <h2>{{ project.project_number }} - {{ project.name }}</h2>

    <p>
        Are you sure you want to delete this progress update?
    </p>

    <p>
        <strong>Date:</strong>
        {{ progress.date }}
    </p>

    <p>
        <strong>Completed:</strong>
        {{ progress.completed_quantity }} {{ project.unit }}
    </p>

    <p>
        <strong>Remarks:</strong>
        {{ progress.remarks }}
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

        <a href="{% url 'project_detail' project.id %}">
            Cancel
        </a>

    </form>

</body>
</html>
