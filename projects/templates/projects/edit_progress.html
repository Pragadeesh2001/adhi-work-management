<!DOCTYPE html>
<html>
<head>
    <title>Edit Progress</title>
</head>

<body>

    <h1>Edit Progress</h1>

    <h2>{{ project.project_number }} - {{ project.name }}</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Update Progress</button>

    </form>

    <br>

    <a href="{% url 'project_detail' project.id %}">
        Cancel
    </a>

</body>
</html>
