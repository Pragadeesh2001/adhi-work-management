<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    {% if error %}
        <p style="color: red;">
            {{ error }}
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <p>
            <label for="username">Email:</label>
            <input
                type="email"
                id="username"
                name="username"
                required
            >
        </p>

        <p>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </p>

        <button type="submit">Login</button>
    </form>

</body>
</html>
