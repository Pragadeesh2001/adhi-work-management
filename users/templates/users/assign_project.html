<!DOCTYPE html>
<html>
<head>
    <title>Assign Project</title>
</head>

<body>

    <h1>Assign Project</h1>

    <h2>
        {{ project.project_number }} - {{ project.name }}
    </h2>

    <hr>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Assign Project
        </button>

    </form>

    <br>

    <a href="{% url 'management_project_detail' project.id %}">
        Cancel
    </a>

</body>
</html>
