<!DOCTYPE html>
<html>
<head>
    <title>Edit Worker</title>
</head>
<body>

    <h1>Edit Worker</h1>

    <h2>{{ project.project_number }} - {{ project.name }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'project_detail' project.id %}">
        Back to Project
    </a>

</body>
</html>
